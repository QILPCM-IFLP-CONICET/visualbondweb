name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the version used in production (render.yaml, Dockerfile).
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      # Installs spectrojotometer at the commit pinned in pyproject.toml.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" ruff

      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run the tests
        run: python -m pytest -ra

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t visualbondweb .

      - name: Start the server and check that it answers
        run: |
          docker run -d --name vbw -p 8000:8000 visualbondweb
          for i in $(seq 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/ | grep -q "<title>"

      - name: Server log
        if: always()
        run: docker logs vbw || true
